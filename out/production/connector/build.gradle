package out.production.connector

plugins {
   id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.0.5'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

/*shadowJar {
    archiveBaseName.set('moraysalgovisualizer')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'runner.Servermain'
    }
}*/

repositories {
    mavenCentral()
}
tasks.startShadowScripts.enabled = false
tasks.shadowDistZip.enabled = false
tasks.shadowDistTar.enabled = false
tasks.distZip.enabled = false
tasks.distTar.enabled = false
tasks.startScripts.enabled = false

application {
    mainClass = 'runner.Servermain'
}


tasks.jar {
    manifest {
        attributes(
                'Main-Class': application.mainClass.get()
        )
    }
}


sourceSets {
    main {
        java {
            exclude 'runner/Main.java'
            exclude 'animations/**'
            exclude 'runner/User_safe_interface_api.java'
        }
    }
}


// Configure Java compilation to use the toolchain
java {
  //  toolchain {
 //       languageVersion = JavaLanguageVersion.of(24)
  //  }
}



dependencies {
    // Core GraalVM SDK for Java 21
   // implementation "org.graalvm.sdk:graal-sdk:23.1.2"

    // Required Polyglot API and JavaScript language support
  //  implementation 'org.graalvm.polyglot:polyglot:23.1.2'
  //  implementation 'org.graalvm.polyglot:js:23.1.2'

    // JavaScript ScriptEngine support (optional, but likely needed for your endpoints)
  //  implementation 'org.graalvm.js:js-scriptengine:23.1.2'
    implementation 'org.springframework.boot:spring-boot-starter-web:4.0.5'
    implementation "org.graalvm.polyglot:polyglot:24.2.2"
    implementation "org.graalvm.polyglot:js:24.2.2"
    implementation "org.graalvm.truffle:truffle-api:24.2.2"
    implementation "org.graalvm.polyglot:tools:24.2.2"
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}



test {
    useJUnitPlatform()

    // Skip GUI tests in CI environment
    if (System.getenv('CI') != null) {
        exclude '**/Visual_partTest*'
        exclude '**/User_safe_interface_apiTest*'
        exclude '**/AlgorithmRunnerTest*'
    }


}




