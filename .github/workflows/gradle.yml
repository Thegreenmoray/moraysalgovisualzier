name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    # Install Java 24 manually (required for your JS engine)
    - name: Install JDK 24 manually
      run: |
        wget https://download.java.net/java/early_access/jdk24/10/GPL/openjdk-24-ea+10_linux-x64_bin.tar.gz
        tar -xzf openjdk-24-ea+10_linux-x64_bin.tar.gz
        sudo mv jdk-24 /usr/lib/jvm/jdk-24
        echo "JAVA_HOME=/usr/lib/jvm/jdk-24" >> $GITHUB_ENV
        echo "/usr/lib/jvm/jdk-24/bin" >> $GITHUB_PATH

    - name: Verify Java version
      run: java -version

    # Gradle setup (keep this)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

    - name: Build with Gradle Wrapper
      run: ./gradlew build

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # Install Java 24 manually again for dependency submission
    - name: Install JDK 24 manually
      run: |
        wget https://download.java.net/java/early_access/jdk24/10/GPL/openjdk-24-ea+10_linux-x64_bin.tar.gz
        tar -xzf openjdk-24-ea+10_linux-x64_bin.tar.gz
        sudo mv jdk-24 /usr/lib/jvm/jdk-24
        echo "JAVA_HOME=/usr/lib/jvm/jdk-24" >> $GITHUB_ENV
        echo "/usr/lib/jvm/jdk-24/bin" >> $GITHUB_PATH

    - name: Verify Java version
      run: java -version

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582


